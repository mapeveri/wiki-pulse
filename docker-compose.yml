name: seo-marketing-analytics-platform

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: smap-clickhouse
    ports:
      - "8123:8123" # HTTP interface (used by the HTTP clients)
      - "9000:9000" # Native protocol
    environment:
      CLICKHOUSE_DB: raw
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  clickhouse-data:
