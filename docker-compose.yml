name: seo-marketing-analytics-platform

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: smap-clickhouse
    ports:
      - "8123:8123" # HTTP interface (used by the HTTP clients)
      - "9000:9000" # Native protocol
    environment:
      CLICKHOUSE_DB: raw
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    container_name: smap-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      # PLAINTEXT listener for in-network clients; OUTSIDE for host clients.
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092" # Kafka API for host clients
      - "9644:9644" # Admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot job that creates the topics explicitly. Redpanda can auto-create
  # topics, but pre-creating them (including the DLQ topics) makes the pipeline
  # deterministic and independent of broker-side auto-creation.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.18
    container_name: smap-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in pageviews.raw articles.raw pageviews.raw.dlq articles.raw.dlq; do
          rpk topic create "$$topic" --partitions 3 --brokers redpanda:29092 || true
        done
        rpk topic list --brokers redpanda:29092

volumes:
  clickhouse-data:
