apiVersion: batch/v1
kind: CronJob
metadata:
  name: crawler-articles
spec:
  schedule: "0 4 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: crawler
              image: wikipulse/crawler:latest
              imagePullPolicy: IfNotPresent
              args:
                - "--topics-file"
                - "/config/topics.txt"
                - "--kafka-brokers"
                - "redpanda:29092"
                - "--topic"
                - "articles.raw"
              volumeMounts:
                - name: topics
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: topics
              configMap:
                name: topics
