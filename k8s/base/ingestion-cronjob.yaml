apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion-pageviews
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingestion
              image: wikipulse/ingestion:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  wikipulse-ingest pageviews
                  --start "$(date -d '8 days ago' +%Y%m%d)"
                  --end "$(date -d '1 day ago' +%Y%m%d)"
                  --topics-file /config/topics.txt
              envFrom:
                - configMapRef:
                    name: wikipulse-config
              volumeMounts:
                - name: topics
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: topics
              configMap:
                name: topics
