apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wikipulse

resources:
  - k8s/base/namespace.yaml
  - k8s/base/configmap.yaml
  - k8s/base/clickhouse.yaml
  - k8s/base/redpanda.yaml
  - k8s/base/redpanda-topics-job.yaml
  - k8s/base/sink.yaml
  - k8s/base/api.yaml
  - k8s/base/api-hpa.yaml
  - k8s/base/dashboard.yaml
  - k8s/base/ingestion-cronjob.yaml
  - k8s/base/crawler-cronjob.yaml
  - k8s/base/dbt-cronjob.yaml

# Generated from the same files used by docker-compose, so the schema and the
# tracked topics have a single source of truth.
configMapGenerator:
  - name: clickhouse-init
    files:
      - infra/clickhouse/init/01_databases.sql
      - infra/clickhouse/init/02_raw_tables.sql
  - name: topics
    files:
      - ingestion/topics.txt

generatorOptions:
  disableNameSuffixHash: true
